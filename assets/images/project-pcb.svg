<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675">

<defs>

<linearGradient id="bg"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

<stop offset="0%" stop-color="#07111f"/>
<stop offset="100%" stop-color="#1d4ed8"/>

</linearGradient>

<linearGradient id="pcb"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

<stop offset="0%" stop-color="#2563eb"/>
<stop offset="100%" stop-color="#60a5fa"/>

</linearGradient>

</defs>

<rect width="1200"
      height="675"
      fill="url(#bg)"/>

<!-- PCB -->

<rect x="120"
      y="110"
      width="520"
      height="360"
      rx="20"
      fill="url(#pcb)"/>

<!-- Copper Tracks -->

<g stroke="#dbeafe"
   stroke-width="6"
   fill="none"
   opacity="0.85">

<path d="M170 170 H320 V240 H480"/>

<path d="M200 260 H420 V330 H560"/>

<path d="M180 390 H500"/>

<path d="M250 150 V420"/>

<path d="M390 150 V420"/>

<path d="M520 150 V420"/>

</g>

<!-- Pads -->

<g fill="#ffffff">

<circle cx="170" cy="170" r="10"/>
<circle cx="320" cy="170" r="10"/>
<circle cx="320" cy="240" r="10"/>
<circle cx="480" cy="240" r="10"/>

<circle cx="200" cy="260" r="10"/>
<circle cx="420" cy="260" r="10"/>
<circle cx="420" cy="330" r="10"/>
<circle cx="560" cy="330" r="10"/>

</g>

<!-- Camera -->

<g transform="translate(850 220)">

<circle r="95"
fill="#ffffff"/>

<circle r="55"
fill="#2563eb"/>

<circle r="20"
fill="#0f172a"/>

</g>

<!-- Crosshair -->

<g stroke="#60a5fa"
stroke-width="3">

<line x1="850"
y1="90"
x2="850"
y2="350"/>

<line x1="720"
y1="220"
x2="980"
y2="220"/>

</g>

<!-- Magnifier -->

<circle cx="520"
cy="370"
r="70"
fill="none"
stroke="#ffffff"
stroke-width="8"/>

<line x1="570"
y1="420"
x2="640"
y2="490"
stroke="#ffffff"
stroke-width="8"/>

<!-- AI Nodes -->

<g fill="#60a5fa">

<circle cx="960" cy="430" r="12"/>
<circle cx="1015" cy="470" r="12"/>
<circle cx="915" cy="500" r="12"/>
<circle cx="1035" cy="535" r="12"/>
<circle cx="960" cy="565" r="12"/>

</g>

<g stroke="#60a5fa"
stroke-width="3">

<line x1="960" y1="430" x2="1015" y2="470"/>

<line x1="1015" y1="470" x2="1035" y2="535"/>

<line x1="960" y1="430" x2="915" y2="500"/>

<line x1="915" y1="500" x2="960" y2="565"/>

<line x1="960" y1="565" x2="1035" y2="535"/>

</g>

<!-- Inspection Target -->

<circle cx="520"
cy="250"
r="26"
fill="none"
stroke="#ef4444"
stroke-width="5"/>

<line x1="495"
y1="250"
x2="545"
y2="250"
stroke="#ef4444"
stroke-width="4"/>

<line x1="520"
y1="225"
x2="520"
y2="275"
stroke="#ef4444"
stroke-width="4"/>

<text x="600"
y="625"
text-anchor="middle"
font-size="34"
font-family="Inter,Arial"
font-weight="700"
fill="#ffffff">

AI PCB Inspection

</text>

</svg>
