<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675">

<defs>

<linearGradient id="bg"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

<stop offset="0%" stop-color="#081321"/>
<stop offset="100%" stop-color="#1e40af"/>

</linearGradient>

<linearGradient id="panel"
                x1="0%"
                y1="0%"
                x2="0%"
                y2="100%">

<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#edf4ff"/>

</linearGradient>

</defs>

<rect width="1200"
      height="675"
      fill="url(#bg)"/>

<!-- Cloud -->

<g transform="translate(600 120)">

<ellipse cx="0" cy="30" rx="85" ry="32" fill="#ffffff"/>
<ellipse cx="-45" cy="40" rx="45" ry="28" fill="#ffffff"/>
<ellipse cx="45" cy="40" rx="45" ry="28" fill="#ffffff"/>

<text x="0"
      y="45"
      text-anchor="middle"
      font-size="20"
      font-family="Inter"
      font-weight="700"
      fill="#2563eb">

MQTT

</text>

</g>

<!-- Connection Lines -->

<g stroke="#60a5fa"
   stroke-width="3"
   stroke-dasharray="10 10">

<line x1="600" y1="170" x2="300" y2="330"/>
<line x1="600" y1="170" x2="900" y2="330"/>
<line x1="600" y1="170" x2="600" y2="500"/>

</g>

<!-- Factory -->

<g transform="translate(160 310)">

<rect width="260"
      height="180"
      rx="10"
      fill="url(#panel)"/>

<polygon points="0,90 70,40 140,90 210,40 260,80 260,180 0,180"
         fill="#dbeafe"/>

<rect x="40" y="105" width="40" height="75" fill="#2563eb"/>
<rect x="110" y="105" width="40" height="75" fill="#2563eb"/>
<rect x="180" y="105" width="40" height="75" fill="#2563eb"/>

<rect x="205" y="20"
      width="22"
      height="60"
      fill="#94a3b8"/>

</g>

<!-- Dashboard -->

<g transform="translate(760 270)">

<rect width="300"
      height="220"
      rx="16"
      fill="url(#panel)"/>

<rect x="25"
      y="30"
      width="250"
      height="12"
      rx="6"
      fill="#cbd5e1"/>

<polyline points="35,165 80,120 120,135 175,80 220,95 265,45"
          fill="none"
          stroke="#2563eb"
          stroke-width="6"/>

<rect x="40" y="185" width="28" height="20" fill="#60a5fa"/>
<rect x="85" y="170" width="28" height="35" fill="#60a5fa"/>
<rect x="130" y="145" width="28" height="60" fill="#60a5fa"/>
<rect x="175" y="120" width="28" height="85" fill="#60a5fa"/>
<rect x="220" y="95" width="28" height="110" fill="#60a5fa"/>

</g>

<!-- Gateway -->

<g transform="translate(545 470)">

<rect width="110"
      height="90"
      rx="10"
      fill="#ffffff"/>

<circle cx="25" cy="25" r="5" fill="#22c55e"/>
<circle cx="45" cy="25" r="5" fill="#3b82f6"/>
<circle cx="65" cy="25" r="5" fill="#f59e0b"/>

<rect x="20"
      y="50"
      width="70"
      height="12"
      rx="6"
      fill="#2563eb"/>

<text x="55"
      y="80"
      text-anchor="middle"
      font-size="14"
      font-family="Inter"
      fill="#64748b">

Gateway

</text>

</g>

<!-- Sensor Nodes -->

<g fill="#60a5fa">

<circle cx="220" cy="560" r="12"/>
<circle cx="360" cy="560" r="12"/>
<circle cx="840" cy="560" r="12"/>
<circle cx="980" cy="560" r="12"/>

</g>

<g stroke="#60a5fa"
   stroke-width="3">

<line x1="220" y1="560" x2="300" y2="470"/>
<line x1="360" y1="560" x2="300" y2="470"/>
<line x1="840" y1="560" x2="910" y2="490"/>
<line x1="980" y1="560" x2="910" y2="490"/>

</g>

<!-- Wireless Waves -->

<g stroke="#93c5fd"
   stroke-width="3"
   fill="none">

<path d="M585 510
         a25 25 0 0 1 30 0"/>

<path d="M575 500
         a40 40 0 0 1 50 0"/>

<path d="M565 488
         a55 55 0 0 1 70 0"/>

</g>

<!-- Bottom Title -->

<text x="600"
      y="635"
      text-anchor="middle"
      font-family="Inter"
      font-size="34"
      font-weight="700"
      fill="#ffffff">

Industrial IoT Platform

</text>

</svg>
