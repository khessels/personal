<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">

<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#1e3a8a"/>

</linearGradient>

<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">

<stop offset="0%" stop-color="#3b82f6"/>
<stop offset="100%" stop-color="#60a5fa"/>

</linearGradient>

</defs>

<rect width="1200"
      height="675"
      fill="url(#bg)"/>

<!-- Dashboard -->

<rect x="120"
      y="110"
      width="960"
      height="455"
      rx="24"
      fill="#ffffff"
      opacity="0.96"/>

<!-- Header -->

<rect x="120"
      y="110"
      width="960"
      height="70"
      rx="24"
      fill="url(#accent)"/>

<circle cx="165" cy="145" r="8" fill="#ffffff"/>
<circle cx="190" cy="145" r="8" fill="#ffffff"/>
<circle cx="215" cy="145" r="8" fill="#ffffff"/>

<!-- Sidebar -->

<rect x="145"
      y="205"
      width="180"
      height="320"
      rx="10"
      fill="#e2e8f0"/>

<rect x="175" y="235" width="120" height="14" rx="7" fill="#3b82f6"/>
<rect x="175" y="275" width="100" height="12" rx="6" fill="#94a3b8"/>
<rect x="175" y="315" width="120" height="12" rx="6" fill="#94a3b8"/>
<rect x="175" y="355" width="90" height="12" rx="6" fill="#94a3b8"/>
<rect x="175" y="395" width="110" height="12" rx="6" fill="#94a3b8"/>

<!-- Statistics -->

<rect x="365" y="215" width="210" height="110" rx="12" fill="#dbeafe"/>
<rect x="610" y="215" width="210" height="110" rx="12" fill="#dbeafe"/>
<rect x="855" y="215" width="180" height="110" rx="12" fill="#dbeafe"/>

<!-- Bar Chart -->

<rect x="390" y="470" width="620" height="8" fill="#cbd5e1"/>

<rect x="420" y="420" width="40" height="50" fill="#2563eb"/>
<rect x="490" y="370" width="40" height="100" fill="#2563eb"/>
<rect x="560" y="320" width="40" height="150" fill="#2563eb"/>
<rect x="630" y="390" width="40" height="80" fill="#2563eb"/>
<rect x="700" y="290" width="40" height="180" fill="#2563eb"/>
<rect x="770" y="340" width="40" height="130" fill="#2563eb"/>
<rect x="840" y="250" width="40" height="220" fill="#2563eb"/>
<rect x="910" y="360" width="40" height="110" fill="#2563eb"/>

<!-- Cloud -->

<ellipse cx="920" cy="165" rx="36" ry="18" fill="#ffffff"/>
<ellipse cx="895" cy="170" rx="24" ry="16" fill="#ffffff"/>
<ellipse cx="945" cy="170" rx="24" ry="16" fill="#ffffff"/>

<!-- Sync -->

<path d="M860 165
A25 25 0 1 1 860 164"
fill="none"
stroke="#ffffff"
stroke-width="4"/>

<polygon points="880,160 872,170 888,170"
fill="#ffffff"/>

<!-- Shopping Cart -->

<path d="M925 520
L975 520
L995 430
L900 430"
fill="none"
stroke="#2563eb"
stroke-width="6"/>

<circle cx="930" cy="540" r="10" fill="#2563eb"/>
<circle cx="975" cy="540" r="10" fill="#2563eb"/>

<text x="600"
      y="625"
      text-anchor="middle"
      font-size="34"
      font-family="Inter,Arial"
      fill="#ffffff"
      font-weight="700">

Enterprise Retail Platform

</text>

</svg>
