<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

<defs>

<linearGradient id="bg"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

<stop offset="0%" stop-color="#2563eb"/>
<stop offset="100%" stop-color="#1d4ed8"/>

</linearGradient>

</defs>

<!-- Rounded square -->

<rect x="24"
      y="24"
      width="464"
      height="464"
      rx="96"
      fill="url(#bg)"/>

<!-- Circuit traces -->

<g stroke="#93c5fd"
   stroke-width="5"
   opacity="0.30"
   fill="none">

<path d="M70 120 H170 V170 H240"/>

<path d="M420 120 H340 V220 H280"/>

<path d="M110 390 H220 V310 H280"/>

<path d="M430 390 H340 V340 H300"/>

</g>

<!-- Circuit nodes -->

<g fill="#bfdbfe"
   opacity="0.35">

<circle cx="70" cy="120" r="6"/>
<circle cx="170" cy="120" r="6"/>
<circle cx="170" cy="170" r="6"/>
<circle cx="240" cy="170" r="6"/>

<circle cx="420" cy="120" r="6"/>
<circle cx="340" cy="120" r="6"/>
<circle cx="340" cy="220" r="6"/>
<circle cx="280" cy="220" r="6"/>

</g>

<!-- KH -->

<text
x="256"
y="305"
text-anchor="middle"
font-size="170"
font-family="Inter,Arial,sans-serif"
font-weight="800"
fill="#ffffff">

KH

</text>

</svg>
